name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Work out the base path
        id: base
        run: |
          # A user/org site (<user>.github.io) is served from the domain root.
          # Any other repo is a project site served from /<repo>/.
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static site
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
          VITE_STATIC: "true"
          # Optional: add a form endpoint (Formspree etc.) as a repo variable
          # named FORM_ENDPOINT and the forms will POST there instead of
          # falling back to the visitor's mail client.
          VITE_FORM_ENDPOINT: ${{ vars.FORM_ENDPOINT }}
        run: bun run build:web

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages has no rewrite rules, so a deep link like /products
          # would 404. Serving index.html as the 404 page lets the client
          # router take over and render the right page.
          cp packages/web/dist/index.html packages/web/dist/404.html
          touch packages/web/dist/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
